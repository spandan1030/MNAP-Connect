name = "wa-media-cdn"
main = "worker.js"
compatibility_date = "2026-01-01"

# --- Deploy target -----------------------------------------------------------
# The domain mnalankarpalace.com is on GOOGLE CLOUD DNS, not Cloudflare, so we
# deploy to a free `*.workers.dev` hostname — NO DNS change, deployable today.
# `wrangler deploy` serves at https://wa-media-cdn.<account-subdomain>.workers.dev
# (this account: https://wa-media-cdn.mnap.workers.dev). Set the same host in
# NEXT_PUBLIC_IMAGE_CDN_HOST in both apps.
# NOTE: this MUST be a top-level key (before [vars]); under [vars] it would be
# parsed as a Worker variable instead of the deploy-target setting.
workers_dev = true

# The Supabase project origin the Worker proxies (public Storage host — no secrets).
[vars]
SUPABASE_ORIGIN = "https://tqnirshwiqpwbqdcrgbr.supabase.co"

# --- UPGRADE (later, optional): branded custom domain ------------------------
# Only after the zone `mnalankarpalace.com` is moved onto Cloudflare. Then a
# custom-domain route also lets EDGE CACHE HITS bypass the Worker entirely, which
# removes the workers.dev free-tier request ceiling (see README "Limits"). To
# switch: set `workers_dev = false`, uncomment the route, and redeploy.
# [[routes]]
# pattern = "cdn.mnalankarpalace.com"
# custom_domain = true
